name: Socrates AI Agent CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-eval-and-deploy:
    name: Run Unit Tests, Integration Tests, ADK Eval & IaC Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (if secrets provided)
        uses: google-github-actions/auth@v2
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        if: ${{ env.GCP_SA_KEY != '' }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Agent Development Kit (ADK) & CLI
        run: |
          uv tool install google-agents-cli
          agents-cli --version

      - name: Install Project Dependencies
        run: |
          uv sync --all-extras --dev

      - name: Run Unit and Integration Tests
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "1"
          GOOGLE_CLOUD_PROJECT: "onboarding-project-fde"
          GOOGLE_CLOUD_LOCATION: "us-central1"
        run: |
          uv run pytest tests/unit tests/integration

      - name: Run ADK Behavioral Evaluation Suite
        env:
          GOOGLE_GENAI_USE_VERTEXAI: "1"
          GOOGLE_CLOUD_PROJECT: "onboarding-project-fde"
          GOOGLE_CLOUD_LOCATION: "us-central1"
        run: |
          uv run pytest tests/eval || true

      - name: Run ADK Code Quality & Linting
        run: |
          agents-cli lint || true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Validate Terraform Infrastructure (IaC)
        run: |
          cd deployment/terraform/single-project
          terraform init -backend=false
          terraform validate

      - name: Build Docker Container Image
        run: |
          docker build -t socrates-ai-agent:ci-test .
